name: Deploy PRD Frontend to GitHub Pages

on:
  push:
    branches:
      - feat/tokenize-styles-20260319
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prd/frontend/package-lock.json

      - name: Install & build PRD Frontend
        working-directory: prd/frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prd/frontend/dist
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com